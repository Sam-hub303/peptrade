<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Peptrade</title>
<style>html,body{background:#07080a!important}
.pt-boot{position:fixed;inset:0;z-index:2147483647;background:#07080a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transition:opacity .45s ease}
.pt-boot img{height:56px;width:auto;display:block}
.pt-boot-bar{width:220px;height:1px;background:#24272c;position:relative;overflow:hidden}
.pt-boot-bar i{position:absolute;top:0;bottom:0;left:0;width:40%;background:#9fe3c4;animation:pt-boot 1.15s cubic-bezier(.6,0,.3,1) infinite}
.pt-boot-txt{font:12px 'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a8d93;letter-spacing:.12em}
@keyframes pt-boot{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.pt-boot-bar i{animation:none;width:100%}}</style>
<script>(function(){var o=document.createElement('div');o.className='pt-boot';o.innerHTML="<img src=\"./assets/peptrade-logo.png\" alt=\"Peptrade\"><div class=\"pt-boot-bar\"><i></i></div><div class=\"pt-boot-txt\">NAČÍTÁNÍ</div>";document.documentElement.appendChild(o);
var t0=Date.now();function ready(){var h=document.querySelector('header');return h&&document.body&&h.textContent.indexOf('{{')<0&&!document.querySelector('x-dc');}
function done(){o.style.opacity='0';setTimeout(function(){o.remove()},500);}
(function w(){if(ready()||Date.now()-t0>10000){var f=document.fonts&&document.fonts.ready;(f||Promise.resolve()).then(function(){requestAnimationFrame(done)});}else setTimeout(w,40);})();})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js?v=e5e826df"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@200;300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#07080a"></rect><text x="50" y="64" text-anchor="middle" font-family="Georgia,serif" font-size="44" fill="#9fe3c4">P</text></svg></template>
<style>
html,body{margin:0;background:#07080a;color:#ece8e1;font-family:'Lexend',sans-serif;-webkit-font-smoothing:antialiased}
a{color:#ece8e1;text-decoration:none}a:hover{color:#9fe3c4}
@media (max-width:760px){[data-m=header]{flex-wrap:wrap!important;padding:12px 16px!important;gap:10px 12px!important}[data-m=nav]{order:3;width:100%;overflow-x:auto;gap:22px!important;font-size:13px!important;white-space:nowrap;padding-bottom:2px}[data-m=logo]{height:22px!important}[data-m=herobottle]{width:58vw!important;margin-top:-16vh}[data-m=heromsg]{left:16px!important;right:16px!important;top:auto!important;bottom:9vh!important;transform:none!important;max-width:none!important;text-align:left!important}[data-m=psticky]{padding-top:116px!important}[data-m=phead]{flex-wrap:wrap!important;gap:12px!important}[data-m=pbottle]{left:50%!important;top:28%!important;height:32vh!important}[data-m=pglow]{left:50%!important;top:28%!important}[data-m=pcard]{top:auto!important;bottom:0!important;left:0!important;right:0!important;width:auto!important;transform:none!important;padding:16px!important;gap:8px!important}[data-m=pcard] dl{display:none!important}[data-m=ptab]{display:none!important}[data-m=benefit]{grid-template-columns:28px 1fr!important}[data-m=benefit]>span:last-child{grid-column:2;justify-self:start}[data-m=detailimg]{height:56vh!important}}
</style>
<script src="./i18n.js?v=e5e826df"></script>
</helmet>

<header data-m="header" style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:20px clamp(20px,4vw,48px);background:#07080ae6;backdrop-filter:blur(10px);border-bottom:1px solid #15171a">
  <a href="Peptrade%20Shop.dc.html"><img data-m="logo" src="./assets/peptrade-logo.png" alt="Peptrade" style="height:30px;width:auto;display:block"></a>
  <nav data-m="nav" style="display:flex;gap:32px;font-size:14px;color:#b9b6b0">
    <a href="Peptrade%20Shop.dc.html#produkty">Produkty</a>
    <a href="Peptrade%20Shop.dc.html#proc">Proč Peptrade</a>
    <a href="Peptrade%20Katalog.dc.html" style="color:#9fe3c4">Katalog</a>
    <a href="Peptrade%20Kontakt.dc.html">Kontakt</a>
  </nav>
  <a href="Peptrade%20Kosik.dc.html" style="display:flex;align-items:center;gap:10px;border:1px solid #2c3036;border-radius:999px;padding:9px 16px;font:500 13px 'Lexend',sans-serif">Košík <span style="display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:999px;background:#9fe3c4;color:#07080a;font:500 11px 'IBM Plex Mono',monospace">{{ cartCount }}</span></a>
</header>

<main style="padding:96px clamp(20px,4vw,48px) 120px;display:flex;flex-direction:column;gap:56px">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap">
    <div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8a8d93;letter-spacing:.12em">KATALOG</div>
      <h1 style="margin:12px 0 0;font-family:'Lexend',sans-serif;font-weight:300;font-size:clamp(48px,6vw,88px);line-height:1;letter-spacing:-0.02em">Všechny produkty</h1>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6d7076;letter-spacing:.08em">CENY VČETNĚ DPH</div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px">
    <sc-for list="{{ products }}" as="p" hint-placeholder-count="6">
      <article style="display:flex;flex-direction:column;border:1px solid #15171a;border-radius:6px;overflow:hidden;background:#0b0c0e;transition:border-color .3s" style-hover="border-color:#2c3036">
        <div onClick="{{ p.open }}" style="position:relative;aspect-ratio:4/5;cursor:pointer;background:radial-gradient(70% 60% at 50% 55%,#121a17,#0b0c0e)">
          <img src="{{ p.src }}" alt="{{ p.name }}" style="position:absolute;inset:10%;width:80%;height:80%;object-fit:contain;transition:transform .6s cubic-bezier(.2,.7,.2,1)" style-hover="transform:scale(1.05) translateY(-6px)">
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;padding:22px 22px 24px;border-top:1px solid #15171a">
          <div style="display:flex;justify-content:space-between;gap:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em">
            <span style="color:#9fe3c4">{{ p.category }}</span>
            <span style="color:#6d7076">{{ p.spec }}</span>
          </div>
          <h2 style="margin:0;font-family:'Lexend',sans-serif;font-weight:300;font-size:36px;line-height:1;letter-spacing:-0.01em"><a href="{{ p.href }}">{{ p.name }}</a></h2>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px">
            <div style="font-family:'Lexend',sans-serif;font-size:28px">{{ p.priceLabel }}</div>
            <sc-if value="{{ p.empty }}" hint-placeholder-val="{{ true }}">
              <button onClick="{{ p.add }}" style="background:#9fe3c4;color:#07080a;border:1px solid #9fe3c4;border-radius:999px;padding:11px 18px;font:600 13px 'Lexend',sans-serif;cursor:pointer">Do košíku</button>
            </sc-if>
            <sc-if value="{{ p.inCart }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex;align-items:center;border:1px solid #9fe3c4;border-radius:999px;overflow:hidden">
                <button onClick="{{ p.remove }}" aria-label="Ubrat" style="width:40px;height:40px;background:transparent;border:0;color:#9fe3c4;font:500 18px 'IBM Plex Mono',monospace;cursor:pointer" style-hover="background:#9fe3c41a">−</button>
                <span style="min-width:28px;text-align:center;font:500 14px 'IBM Plex Mono',monospace;color:#ece8e1">{{ p.qty }}</span>
                <button onClick="{{ p.add }}" aria-label="Přidat" style="width:40px;height:40px;background:transparent;border:0;color:#9fe3c4;font:500 18px 'IBM Plex Mono',monospace;cursor:pointer" style-hover="background:#9fe3c41a">+</button>
              </div>
            </sc-if>
          </div>
        </div>
      </article>
    </sc-for>
  </div>
</main>

<div style="border-top:1px solid #15171a;padding:18px clamp(20px,4vw,48px);display:flex;justify-content:center;align-items:center;gap:10px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.04em;color:#8a8d93"><span style="flex:none;width:16px;height:16px;border:1px solid #6d7076;border-radius:999px;display:grid;place-items:center;font-size:10px;line-height:1">i</span>Pouze pro laboratorní a výzkumné účely. Není určeno k lidské ani veterinární spotřebě.</div>
<footer style="border-top:1px solid #15171a;padding:32px clamp(20px,4vw,48px);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:#6d7076;font-family:'IBM Plex Mono',monospace">
  <span>© 2026 Peptrade</span><span><br></span>
</footer>

<div style="display:none"><img data-pimg="p0" src="./assets/n-p0.png"><img data-pimg="p1" src="./assets/n-p1.png"><img data-pimg="p2" src="./assets/n-p2.png"><img data-pimg="p3" src="./assets/n-p3.png"><img data-pimg="p4" src="./assets/n-p4.png"><img data-pimg="p5" src="./assets/n-p5.png"></div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PRODUCTS = [
  { id: 'p4', category: 'PEPTID', name: 'BPC-157', price: 890, spec: '10 MG' },
  { id: 'p3', category: 'PEPTID', name: 'TB-500', price: 990, spec: '10 MG' },
  { id: 'p5', category: 'PEPTID', name: 'GHK-Cu', price: 690, spec: '10 MG' },
  { id: 'p2', category: 'PEPTID', name: 'Ipamorelin', price: 790, spec: '10 MG' },
  { id: 'p1', category: 'PEPTID', name: 'Tesamorelin', price: 1290, spec: '10 MG' },
  { id: 'p0', category: 'PŘÍSLUŠENSTVÍ', name: 'BAC Water', price: 190, spec: '10 ML' },
];
const fmt = n => n.toLocaleString('cs-CZ') + ' Kč';
class Component extends DCLogic {
  state = { cart: {} };
  componentDidMount() {
    this.imgs = {};
    document.querySelectorAll('[data-pimg]').forEach(el => { this.imgs[el.dataset.pimg] = el.src; });
    try { const c = JSON.parse(localStorage.getItem('peptrade-cart') || '{}'); if (c) this.setState({ cart: c }); } catch (e) {}
    this.forceUpdate();
  }
  renderVals() {
    const { cart } = this.state;
    return {
      cartCount: Object.values(cart).reduce((a, b) => a + b, 0),
      products: PRODUCTS.map((x, i) => {
        const q = cart[x.id] || 0;
        return {
          num: String(i + 1).padStart(2, '0'), href: 'Peptrade%20Detail.dc.html?id=' + x.id, open: () => { location.href = 'Peptrade%20Detail.dc.html?id=' + x.id; }, name: x.name, category: x.category, spec: x.spec,
          src: (this.imgs && this.imgs[x.id]) || './assets/n-' + x.id + '.png',
          priceLabel: fmt(x.price),
          qty: q, empty: q === 0, inCart: q > 0,
          remove: () => this.setState(s => { const c = { ...s.cart }; c[x.id] = (c[x.id] || 0) - 1; if (c[x.id] <= 0) delete c[x.id]; try { localStorage.setItem('peptrade-cart', JSON.stringify(c)); } catch (e) {} return { cart: c }; }),
          add: () => window.peptradeConfirm(() => this.setState(s => { const cart = { ...s.cart, [x.id]: (s.cart[x.id] || 0) + 1 }; try { localStorage.setItem('peptrade-cart', JSON.stringify(cart)); } catch (e) {} return { cart }; })),
        };
      }),
    };
  }
}
</script>
</body>
</html>
